[project]
name = "qlonil"
version = "1.0.0"
description = "Qlonil — a Python storefront: FastAPI, SQLAlchemy, Jinja2 and Postgres."
requires-python = ">=3.11"

# Runtime dependencies. Vercel's Python builder (CLI >= 48.2.0) resolves with uv
# from this file and ignores requirements.txt when no lockfile is present, so the
# runtime set must be declared here too. Keep this list in sync with
# requirements.txt.
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "email-validator==2.3.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# Local development server only; Vercel runs the ASGI app directly.
dev = ["uvicorn[standard]==0.52.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ISC", "RUF"]
# UP046 wants PEP 695 generics, which need Python 3.12; this project targets 3.11+.
ignore = ["E501", "UP046"]
