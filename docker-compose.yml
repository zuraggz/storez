# Local stack: Postgres plus the app, so development matches the Neon-backed
# deployment. Not used by Vercel.
#
#   cp .env.example .env && docker compose up --build
#   storefront → http://localhost:8000

services:
  postgres:
    image: postgres:17-alpine
    container_name: qlonil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qlonil}
      POSTGRES_USER: ${POSTGRES_USER:-qlonil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlonil} -d ${POSTGRES_DB:-qlonil}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: .
    container_name: qlonil-web
    restart: unless-stopped
    environment:
      # The app creates the schema and seeds demo data on first boot.
      DATABASE_URL: postgresql://${POSTGRES_USER:-qlonil}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlonil}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      AUTO_INIT_DB: ${AUTO_INIT_DB:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: qlonil_postgres_data
